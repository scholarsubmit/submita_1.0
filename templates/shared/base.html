<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F6B4C">
    <title>{{ app_name }} — {% block title %}Assignment Platform{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ app_name }} is an assignment submission, AI grading, and plagiarism checking platform built for MOUAU.{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ app_name }}">
    <meta property="og:title" content="{{ app_name }} — {% block og_title %}Assignment Platform{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ app_name }} is an assignment submission, AI grading, and plagiarism checking platform built for MOUAU.{% endblock %}">
    <meta property="og:image" content="{{ config.BASE_URL }}{{ url_for('static', filename='icons/icon-512.png') }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ app_name }} — {% block twitter_title %}Assignment Platform{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ app_name }} is an assignment submission, AI grading, and plagiarism checking platform built for MOUAU.{% endblock %}">
    <meta name="twitter:image" content="{{ config.BASE_URL }}{{ url_for('static', filename='icons/icon-512.png') }}">

    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}

    <script>
        // Applied before paint to avoid a flash of the wrong theme.
        (function () {
            var stored = localStorage.getItem('submita-theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="container" style="padding-top: 16px;">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
    <script src="{{ url_for('static', filename='js/visibility-toggles.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
