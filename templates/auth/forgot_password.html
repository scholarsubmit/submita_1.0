{% extends "shared/base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <div class="navbar-brand" style="justify-content: center; margin-bottom: 18px;">
                <img class="mark" src="{{ url_for('static', filename='icons/logo-mark.png') }}" alt="{{ app_name }} logo"><span>{{ app_name }}</span>
            </div>
            <h1 style="font-size: 1.5rem;">Reset your password</h1>
            <p>Enter your account email and we'll send you a reset link.</p>
        </div>

        <div class="card card-pad">
            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 16px; font-size: 0.85rem;">
            <a href="{{ url_for('auth.login') }}">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
