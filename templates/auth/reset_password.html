{% extends "shared/base.html" %}
{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <div class="navbar-brand" style="justify-content: center; margin-bottom: 18px;">
                <img class="mark" src="{{ url_for('static', filename='icons/logo-mark.png') }}" alt="{{ app_name }} logo"><span>{{ app_name }}</span>
            </div>
            <h1 style="font-size: 1.5rem;">Set a new password</h1>
        </div>

        <div class="card card-pad">
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label for="password">New password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" required minlength="10" autofocus>
                        <button type="button" class="password-toggle-btn" data-password-toggle="password" aria-label="Show password">👁</button>
                    </div>
                    <p class="field-hint">At least 10 characters, with uppercase, lowercase, a number, and a symbol.</p>
                </div>

                <div class="field">
                    <label for="confirm_password">Confirm new password</label>
                    <div class="password-field">
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="10">
                        <button type="button" class="password-toggle-btn" data-password-toggle="confirm_password" aria-label="Show password">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Reset password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
